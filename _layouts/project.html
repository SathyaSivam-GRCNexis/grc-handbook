<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: page.slug }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232d1b69'/%3E%3Ctext x='50' y='66' font-size='52' font-weight='800' text-anchor='middle' fill='%23fbbf24' font-family='system-ui'%3EG%3C/text%3E%3C/svg%3E">
</head>
<body>

<section class="subhero">
  <div class="subhero-inner">
    <div class="crumb"><a href="{{ '/' | relative_url }}">{{ site.title }}</a> &nbsp;/&nbsp; Project</div>
    <h1>{{ page.title | default: page.slug | replace: '-', ' ' | capitalize }}</h1>
  </div>
</section>

<nav class="tabnav">
  <div class="tabnav-inner">
    <a href="{{ '/' | relative_url }}">Overview</a>
    <a href="{{ '/#projects' | relative_url }}">Projects</a>
    <a href="{{ '/#reading-order' | relative_url }}">Reading Order</a>
    <a href="{{ '/CURRICULUM/' | relative_url }}">Curriculum</a>
    <a href="https://github.com/{{ site.repository }}">GitHub</a>
    <a href="https://github.com/{{ site.companion_repo }}">Companion (Tech)</a>
  </div>
</nav>

<main class="content">
  {{ content }}
</main>

<footer class="site-footer">
  <p>Maintained by <a href="https://github.com/{{ site.author.github }}">{{ site.author.name }}</a> &middot; Content licensed under CC BY-SA 4.0 &middot; <a href="https://github.com/{{ site.repository }}">View on GitHub</a></p>
</footer>

</body>
</html>
